<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>NokNotes — Login</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 360px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #e94560; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #aaa; }
        input {
            width: 100%;
            padding: 0.55rem 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: 2px solid #e94560; border-color: transparent; }
        button {
            width: 100%;
            padding: 0.65rem;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #c73652; }
        button:disabled { opacity: 0.6; cursor: default; }
        .divider {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
            color: #555;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #0f3460;
        }
        #passkeyBtn {
            background: transparent;
            border: 1px solid #0f3460;
            color: #e0e0e0;
        }
        #passkeyBtn:hover { background: #0f3460; }
        .error {
            color: #e94560;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .error.visible { display: block; }
    </style>
</head>
<body>
<div class="card">
    <h1>NokNotes</h1>
    <p id="errorMsg" class="error">Invalid username or password.</p>
    <form method="POST" action="/api/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
    <div class="divider">or</div>
    <button type="button" id="passkeyBtn">Sign in with passkey</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@13/dist/bundle/index.umd.min.js"></script>
<script src="/dist/login.js"></script>
</body>
</html>
