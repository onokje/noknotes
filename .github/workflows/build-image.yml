name: Build, publish and deploy

on:
  push:
    branches: ['master']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Save ssh private key file
        run: echo "${{ secrets.MY_PRIVATE_DEPLOY_KEY }}" > deploy-ssh-key

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to production (Komodo)
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Trigger Komodo stack deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://komodo.onok.eu/execute/DeployStack \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${{ secrets.KOMODO_API_KEY }}" \
            -H "X-Api-Secret: ${{ secrets.KOMODO_API_SECRET }}" \
            -d '{"stack": "noknotes"}')
          echo "Komodo API response: $response"
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Deploy failed with HTTP $response"
            exit 1
          fi
